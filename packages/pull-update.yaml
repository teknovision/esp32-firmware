# Shared package: the device pulls its own firmware updates from a manifest URL (no push OTA, no OTA password).
# The device must set these substitutions: project_name (needs a dot, for example "teknovision.lighty")
# and update_manifest_url. Optional: fw_version (CI derives it from the release tag, v2026.11.25-1 becomes
# 2026.11.25.1), verify_ssl.
#
# How an update is found: the "Firmware" entity reads the manifest every 6 h. An update is offered when the
# manifest "version" is a different string from fw_version below. The device then refuses to install it if it is
# older than the running version (downgrade protection in the device yaml).

substitutions:
  # Downgrade protection needs a dotted-numeric version, so "dev" is no longer allowed. 0.0.0 is lower than any
  # real release, so a local build never blocks the next release from installing.
  fw_version: "0.0.0"
  verify_ssl: "true"

esphome:
  project:
    name: ${project_name}
    version: ${fw_version}

http_request:
  verify_ssl: ${verify_ssl}
  timeout: 10s
  watchdog_timeout: 15s

# Only pull updates. There is deliberately no "platform: esphome" OTA: without a password it would accept
# firmware from anyone on the LAN.
ota:
  - platform: http_request

update:
  - platform: http_request
    id: firmware_update
    name: "Firmware"
    source: ${update_manifest_url}
    update_interval: 6h
    on_update_available:
      - if:
          condition:
            switch.is_on: auto_update
          then:
            - logger.log: "New firmware found, Auto update is on: installing"
            - update.perform: firmware_update
          else:
            - logger.log: "New firmware found, Auto update is off: press Install on the Firmware entity"

switch:
  - platform: template
    id: auto_update
    name: "Auto update"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# Shows the running firmware version (derived from the release tag) on the device page, so an update is easy to see.
text_sensor:
  - platform: template
    name: "Firmware version"
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return {"${fw_version}"};'

button:
  - platform: template
    name: "Check for update"
    on_press:
      - update.check: firmware_update
