# Shared package: Wi-Fi is set at runtime through the captive portal, never written into the firmware.
# The device must set the substitution "name". Optional: wifi_power_save_mode, wifi_output_power, wifi_ap_timeout,
# web_username. Required at build time: web_password (CI passes it from a GitHub secret, locally use
# "-s web_password ..."). It has no default on purpose, so a build without it fails instead of shipping a known
# password.
#
# Why no ssid here: in ESPHome 2026.9.1 a wifi block with no ssid/networks stores the network saved through the
# captive portal under a fixed key, so it survives every new firmware build. With an ssid in YAML it would not.
#
# ACCEPTED RISK: the "${name}-setup" hotspot is OPEN (no password). Only the Wi-Fi setup pages of the captive
# portal (including /wifisave) skip the web login, so anyone near the device can join it and set a different
# Wi-Fi. A firmware upload on the hotspot is behind the web login AND must be signed with our key.
# It only appears when no Wi-Fi is saved (at once) or after the saved Wi-Fi has been down for wifi_ap_timeout.
# A device moved to a foreign Wi-Fi this way talks to whatever answers there, so device secrets can leak (for
# Lighty the Hue key). Kept on purpose (owner decision 26 Nov 2026): a Wi-Fi change needs no cable.
# The "provisioning" component does not help: its window stops applying once the device has been online
# (provisioning.cpp in ESPHome 2026.9.1), so a later outage would still open the hotspot.

substitutions:
  # Stability (esphome.io/components/wifi): the ESP32 default LIGHT power saving "can decrease the reliability
  # of the WiFi connection"; a lower TX power avoids restarts on a weak USB supply.
  wifi_power_save_mode: none
  wifi_output_power: 15dB
  # How long saved Wi-Fi must be down before the open setup hotspot starts (ESPHome default 90s). 10 min keeps a
  # router restart or short outage from opening the hotspot, which shrinks the window for the accepted risk above.
  # With no saved Wi-Fi at all (first setup) the hotspot still starts at once.
  wifi_ap_timeout: 10min
  web_username: admin

wifi:
  power_save_mode: ${wifi_power_save_mode}
  output_power: ${wifi_output_power}
  ap:
    ssid: "${name}-setup"
    ap_timeout: ${wifi_ap_timeout}

captive_portal:

# captive_portal always loads the web OTA handler. "ota: false" limits it to the moments when the captive
# portal itself is active (setup hotspot). On the normal Wi-Fi the web page has no firmware upload.
# Every device in this repo uses the web page for its settings, so the web server lives here too.
web_server:
  ota: false
  # The login keeps casual LAN users and websites off the page, nothing more. The password is compiled into the
  # firmware and the firmware file is public, so anyone who downloads and extracts it can read the password.
  # Digest sends no plain-text password, but someone who can sniff the LAN can replay a captured login.
  auth:
    username: ${web_username}
    password: ${web_password}
    # ESPHome 2026.9.1 only warns about an undefined substitution (and stays silent for password fields), so a
    # build without web_password would ship the literal text "${web_password}" as the password. This turns
    # that case into a config error ("Unknown value 'web_password_not_set...'").
    type: "${ 'digest' if web_password is defined else 'web_password_not_set_build_with_-s_web_password' }"
  # Serves the page script from the device, so the page (and the login in the browser) does not depend on
  # code loaded from the internet.
  local: true
