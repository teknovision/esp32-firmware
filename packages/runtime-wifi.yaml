# Shared package: Wi-Fi is set at runtime through the captive portal, never written into the firmware.
# The device must set the substitution "name". Optional: wifi_power_save_mode, wifi_output_power, wifi_ap_timeout.
#
# Why no ssid here: in ESPHome 2026.9.1 a wifi block with no ssid/networks stores the network saved through the
# captive portal under a fixed key, so it survives every new firmware build. With an ssid in YAML it would not.
#
# ACCEPTED RISK: the "${name}-setup" hotspot is OPEN (no password). It only appears when no Wi-Fi is saved or
# the saved Wi-Fi fails. While it is up, anyone near the device can join it and, through the captive portal,
# set a different Wi-Fi or upload their own firmware.

substitutions:
  # Stability (esphome.io/components/wifi): the ESP32 default LIGHT power saving "can decrease the reliability
  # of the WiFi connection"; a lower TX power avoids restarts on a weak USB supply.
  wifi_power_save_mode: none
  wifi_output_power: 15dB
  # How long saved Wi-Fi must be down before the open setup hotspot starts (ESPHome default 90s). 10 min keeps a
  # router restart or short outage from opening the hotspot, which shrinks the window for the accepted risk above.
  # With no saved Wi-Fi at all (first setup) the hotspot still starts at once.
  wifi_ap_timeout: 10min

wifi:
  power_save_mode: ${wifi_power_save_mode}
  output_power: ${wifi_output_power}
  ap:
    ssid: "${name}-setup"
    ap_timeout: ${wifi_ap_timeout}

captive_portal:

# captive_portal always loads the web OTA handler. "ota: false" limits it to the moments when the captive
# portal itself is active (setup hotspot). On the normal Wi-Fi the web page has no firmware upload.
# Every device in this repo uses the web page for its settings, so the web server lives here too.
web_server:
  ota: false
