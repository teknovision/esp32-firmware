# Builds every devices/*.yaml and publishes the firmware on GitHub Pages:
#   https://<owner>.github.io/<repo>/firmware/<device>/manifest.json  (+ the .ota.bin next to it)
# Devices poll that manifest and install a build whose version (= the release tag) differs from their own.
# No secrets are used: the firmware contains none, Wi-Fi and Hue settings are entered on the device.
# Every action is pinned by full commit SHA, the tag is in the comment.

name: Release firmware

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build, for example v2026.11.24-1 (the branch is never built)"
        required: true
        type: string

# Read-only by default. Only the deploy job gets the Pages permissions.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      release_url: ${{ steps.meta.outputs.release_url }}
      devices: ${{ steps.devices.outputs.devices }}
    steps:
      # Full history and all tags, so the tag can be checked below (works for private repos too).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version and release page
        id: meta
        env:
          # Passed through env, never pasted into the script, so an odd tag cannot inject shell code.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          # Letters, digits, dot, dash, underscore only (it becomes esphome.project.version in the firmware).
          if ! [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$ ]]; then
            echo "::error::Tag '$tag' is not allowed. Use something like v2026.11.24-1."
            exit 1
          fi
          # A manual run must build an existing tag, never the branch it was started from.
          if ! git rev-parse -q --verify "refs/tags/$tag^{commit}" > /dev/null; then
            echo "::error::Tag '$tag' does not exist in $REPO. Create the tag (or the release) first."
            exit 1
          fi
          # Read the device list from the tag, not from the branch.
          git checkout -q --detach "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_url=$SERVER_URL/$REPO/releases/tag/$tag" >> "$GITHUB_OUTPUT"

      - name: List devices
        id: devices
        run: |
          devices=$(find devices -maxdepth 1 -name '*.yaml' -exec basename {} .yaml \; | sort | jq -R . | jq -cs .)
          if [ "$devices" = "[]" ]; then
            echo "::error::No devices/*.yaml found"
            exit 1
          fi
          echo "devices=$devices" >> "$GITHUB_OUTPUT"
          echo "Devices: $devices"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        device: ${{ fromJSON(needs.prepare.outputs.devices) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Build firmware
        id: build
        uses: esphome/build-action@ae5408cdbc4f70692bf8e345c4982bca05a93667 # v8.1.0
        with:
          yaml-file: devices/${{ matrix.device }}.yaml
          version: "2026.9.1" # ESPHome version, pinned
          complete-manifest: true
          release-url: ${{ needs.prepare.outputs.release_url }}
          substitutions: |
            fw_version=${{ needs.prepare.outputs.tag }}

      - name: Stage manifest and OTA file
        env:
          DEVICE: ${{ matrix.device }}
          # build-action writes its output to a folder named after its "name" output (device name + variant).
          OUT: ${{ steps.build.outputs.name }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          dest="site/firmware/$DEVICE"
          mkdir -p "$dest"
          cp "$OUT/manifest.json" "$dest/manifest.json"
          cp "$OUT/$OUT.ota.bin" "$dest/"
          # The device resolves a relative ota.path next to manifest.json, so the file must sit right there,
          # its MD5 must match, and the manifest version must be this tag.
          python3 - "$dest" "$TAG" <<'EOF'
          import hashlib, json, os, sys
          dest, tag = sys.argv[1], sys.argv[2]
          m = json.load(open(os.path.join(dest, "manifest.json")))
          assert m["version"] == tag, f"manifest version {m['version']!r} is not the tag {tag!r}"
          assert m["builds"], "manifest has no builds"
          for b in m["builds"]:
              ota = b["ota"]
              path = ota["path"]
              assert "/" not in path and not path.startswith("http"), f"ota.path {path!r} is not a plain file name"
              f = os.path.join(dest, path)
              assert os.path.isfile(f), f"ota.path {path!r} does not exist next to manifest.json"
              md5 = hashlib.md5(open(f, "rb").read()).hexdigest()
              assert md5 == ota["md5"], f"MD5 mismatch for {path}"
              print(f"OK {b['chipFamily']}: {path} md5 {md5}")
          EOF
          ls -l "$dest"

      - name: Keep staged files for the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ matrix.device }}
          path: site/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Collect all devices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: site-*
          path: site/
          merge-multiple: true

      - name: Show site
        run: find site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
